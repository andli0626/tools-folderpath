name: Release

# 推 v* 标签触发「编译 + 打包 + 发 Release」；手动触发只编译打包，不发布。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 发 Release 需要写仓库内容的权限（GITHUB_TOKEN 默认只读）。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # 发布不做「新任务顶掉旧任务」：包打一半被取消会留下半套资产，
  # 也可能让 Release 停在草稿态。同 tag 的重复触发改为排队串行。
  cancel-in-progress: false

jobs:
  build-macos:
    name: 编译 (${{ matrix.arch }})
    # macos-14 是 arm64 runner；x86_64 由 rustup 交叉编译，objc2 系列是纯 Rust 绑定，
    # 不需要 Intel 机器也能出 Intel 产物。
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo 产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: 编译两个可执行文件
        working-directory: src-tauri
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            --bin copypath --bin copypath-toolbar

      - name: 收集二进制
        run: |
          mkdir -p "ci-bin/${{ matrix.arch }}"
          cp "src-tauri/target/${{ matrix.target }}/release/copypath" "ci-bin/${{ matrix.arch }}/"
          cp "src-tauri/target/${{ matrix.target }}/release/copypath-toolbar" "ci-bin/${{ matrix.arch }}/"
          lipo -archs "ci-bin/${{ matrix.arch }}/copypath"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: ci-bin/${{ matrix.arch }}
          if-no-files-found: error

  package-macos:
    name: 打包与发布
    needs: build-macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 取回各架构二进制
        uses: actions/download-artifact@v4
        with:
          name: bin-arm64
          path: ci-bin/arm64

      - uses: actions/download-artifact@v4
        with:
          name: bin-x86_64
          path: ci-bin/x86_64

      - name: 恢复可执行权限
        run: chmod +x ci-bin/*/copypath ci-bin/*/copypath-toolbar

      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python3 -c 'import json;print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 tauri.conf.json 的 v$version 不一致" >&2
            exit 1
          fi

      - name: 组装 app / dmg / zip
        run: |
          chmod +x scripts/package-macos.sh
          scripts/package-macos.sh ci-bin dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CopyPath-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
